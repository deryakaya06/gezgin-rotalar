name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    name: Lint ve tip kontrolü
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx turbo run lint check-types

  firestore-rules:
    name: Firestore kural testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      # Firestore emülatörü Java ile çalışır.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Emülatörü önbellekle
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15.33.0

      - run: npm ci
        working-directory: firestore-tests

      - run: npm test
        working-directory: firestore-tests
